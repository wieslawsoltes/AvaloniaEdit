name: UnoEdit branch configuration

on:
  push:
    branches: [port/unoedit]
    paths: ['.github/workflows/uno-branch-setup.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  configure:
    if: github.repository == 'wieslawsoltes/AvaloniaEdit' && github.ref == 'refs/heads/port/unoedit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the explicitly requested default branch
        id: default
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          echo "Current default branch: $current"
          if [ "$current" != 'port/unoedit' ]; then
            # Only the user-requested default_branch field is changed. This
            # token may lack Administration write; do not weaken any policy
            # or search for a different credential when GitHub rejects it.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f default_branch='port/unoedit' --jq .default_branch
          fi
      - name: Verify branch and Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_RESULT: ${{ steps.default.outcome }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{default_branch,has_pages}'
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,status,source}'
          if [ "$DEFAULT_RESULT" != 'success' ]; then
            echo '::warning::Default branch update was rejected by GitHub. Set Settings > General > Default branch to port/unoedit with a repository administrator account.'
          fi
