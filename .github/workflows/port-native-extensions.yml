name: Validate native completion and snippets

on:
  push:
    branches: [port/unoedit]
    paths: ['.github/workflows/port-native-extensions.yml', 'tools/native-extensions.payload.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unoedit-native-extension-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.repository == 'wieslawsoltes/AvaloniaEdit' && github.ref == 'refs/heads/port/unoedit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Materialize verified source against the exact original revision
        shell: bash
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, subprocess
          payload = ''.join(Path(f'tools/native-extensions.payload.{i}').read_text().strip() for i in range(3))
          decoded = lzma.decompress(base64.b64decode(payload, validate=True))
          expected = '14a26ce7166d388752e6c1f0e7102c2a9b03761d5a53d20372dfa7793d6466c2'
          if hashlib.sha256(decoded).hexdigest() != expected:
              raise RuntimeError('Source transport checksum mismatch')
          manifest = json.loads(decoded)
          base = 'af58ef94d88aa0e5e15b26a541aefdc3ef2f4f27'
          if manifest['base_revision'] != base:
              raise RuntimeError('Unexpected source baseline')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          outputs = []
          for entry in manifest['files']:
              path = entry['path']
              pure = PurePosixPath(path)
              if pure.is_absolute() or '..' in pure.parts or not (path.startswith(('src/', 'test/', 'tools/')) or path in ('Directory.Packages.props', '.github/workflows/uno-native.yml')):
                  raise RuntimeError(f'Unexpected output path: {path}')
              if 'content' in entry:
                  content = entry['content']
              else:
                  source = subprocess.check_output(['git', 'show', f"{base}:{entry['base']}"])
                  if hashlib.sha256(source).hexdigest() != entry['base_sha256']:
                      raise RuntimeError(f'Original-source checksum mismatch: {path}')
                  lines = source.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['line_edits']):
                      if not 0 <= start <= end <= len(lines):
                          raise RuntimeError(f'Invalid source edit: {path}')
                      lines[start:end] = replacement.splitlines(keepends=True)
                  content = ''.join(lines)
              data = content.encode('utf-8')
              if hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise RuntimeError(f'Reconstructed-source checksum mismatch: {path}')
              target = Path(path)
              if path.startswith('.github/') and target.read_bytes() != data:
                  raise RuntimeError('Workflow edits must be committed through the authorized workflow connection first')
              outputs.append((target, data))
          for target, data in outputs:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          # Uno's ListBox scrolling members are not implemented on WebAssembly.
          # ListView provides the supported virtualized selector while retaining
          # the editor-owned CompletionListBox public name and template part.
          path = Path('src/UnoEdit.Uno/CodeCompletion/CompletionList.cs')
          text = path.read_text()
          for before, after in (
              ('node is ListBoxItem item', 'node is ListViewItem item'),
              ('CompletionListBox : ListBox', 'CompletionListBox : ListView'),
              ('SelectionMode = SelectionMode.Single', 'SelectionMode = ListViewSelectionMode.Single')):
              if text.count(before) != 1:
                  raise RuntimeError(f'Unexpected completion source: {before}')
              text = text.replace(before, after)
          path.write_text(text)
          print(f'Verified and materialized {len(outputs)} source files; original licenses retained.')
          PY
          git add src test Directory.Packages.props
          git add -f tools/browser-completion.mjs
          git add -u tools/browser-smoke.mjs
          git diff --cached --stat
          git diff --cached > artifacts/native-extensions.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'port: native completion and overload popups, original snippets, selection and input extensions'
          fi
          git rev-parse HEAD > artifacts/source-revision.txt
      - name: Execute original, core and renderer regression suites
        run: |
          python3 tools/build.py test
          python3 -m unittest discover -s test -p test_build_tools.py -v
      - name: Execute original snippet tests and native popup contracts on real Uno
        run: |
          dotnet build test/UnoEdit.Uno.Tests/UnoEdit.Uno.Tests.csproj -c Release -p:UnoEditTargetFrameworks=net10.0-desktop > artifacts/native-tests-build.log 2>&1 || { tail -100 artifacts/native-tests-build.log; exit 1; }
          xvfb-run -a timeout 120s dotnet run --project test/UnoEdit.Uno.Tests/UnoEdit.Uno.Tests.csproj -c Release --no-build > artifacts/native-tests.log 2>&1 || { tail -150 artifacts/native-tests.log; exit 1; }
          tail -20 artifacts/native-tests.log
      - name: Install browser workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build and exercise native desktop sample
        env:
          UNOEDIT_NATIVE_CHECKS: '1'
        run: |
          python3 tools/build.py desktop > artifacts/desktop.log 2>&1 || { tail -100 artifacts/desktop.log; exit 1; }
          xvfb-run -a timeout 120s dotnet run --project src/UnoEdit.Uno.Demo/UnoEdit.Uno.Demo.csproj -c Release -f net10.0-desktop --no-build > artifacts/native-runtime.log 2>&1 || { tail -100 artifacts/native-runtime.log; exit 1; }
          tail -30 artifacts/native-runtime.log
      - name: Publish and test real browser completion, linked snippets and overloads
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 tools/build.py browser --base-path "/$REPOSITORY_NAME/" > artifacts/browser.log 2>&1 || { tail -100 artifacts/browser.log; exit 1; }
          npm install --prefix tools --no-save --package-lock=false playwright@1.64.0
          tools/node_modules/.bin/playwright install --with-deps chromium > artifacts/playwright-install.log 2>&1
          node tools/browser-smoke.mjs artifacts/site "$REPOSITORY_NAME"
      - name: Validate native packages and independent desktop and browser consumers
        run: |
          python3 tools/build.py pack > artifacts/packages.log 2>&1 || { tail -120 artifacts/packages.log; exit 1; }
          tail -25 artifacts/packages.log
      - name: Push only the validated source without overwriting concurrent changes
        run: git push origin HEAD:refs/heads/port/unoedit
      - name: Preserve exact implementation and diagnostic evidence
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
          git rev-parse HEAD > artifacts/source-revision.txt
          test ! -f artifacts/browser-tests/failure-state.json || cat artifacts/browser-tests/failure-state.json
          test ! -f artifacts/browser-tests/console.log || tail -100 artifacts/browser-tests/console.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unoedit-native-extensions-validation
          path: |
            artifacts/tests
            artifacts/browser-tests
            artifacts/packages
            artifacts/*.log
            artifacts/*.binlog
            artifacts/*.patch
            artifacts/*.txt
            artifacts/source.tar.gz
          if-no-files-found: error
          retention-days: 14
