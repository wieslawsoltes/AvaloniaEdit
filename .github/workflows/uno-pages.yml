name: UnoEdit GitHub Pages

on:
  push:
    branches: [port/unoedit]
    paths:
      - '.github/workflows/uno-pages.yml'
      - 'src/**'
      - 'test/**'
      - 'tools/build.py'
      - 'tools/browser-smoke.mjs'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unoedit-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wieslawsoltes/AvaloniaEdit' && github.ref == 'refs/heads/port/unoedit'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify enabled Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{default_branch,has_pages}'
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,status,source}'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test all existing editor, core and renderer regressions
        run: python3 tools/build.py test
      - name: Publish the Uno browser application
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p artifacts
          python3 tools/build.py browser --install-workloads --base-path "/$REPOSITORY_NAME/" > artifacts/browser-build.log 2>&1 || { tail -100 artifacts/browser-build.log; exit 1; }
          tail -10 artifacts/browser-build.log
      - name: Install pinned browser verification tools
        run: |
          npm install --prefix tools --no-save --package-lock=false playwright@1.64.0
          tools/node_modules/.bin/playwright install --with-deps chromium > artifacts/playwright-install.log 2>&1
      - name: Verify the exact published app under the Pages subpath
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node tools/browser-smoke.mjs artifacts/site "$REPOSITORY_NAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - name: Surface failed browser diagnostics
        if: failure()
        run: |
          test ! -f artifacts/browser-tests/results.json || cat artifacts/browser-tests/results.json
          test ! -f artifacts/browser-tests/failure-state.json || cat artifacts/browser-tests/failure-state.json
          test ! -f artifacts/browser-tests/console.log || tail -100 artifacts/browser-tests/console.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unoedit-pages-validation
          path: |
            artifacts/tests
            artifacts/browser-tests
            artifacts/*.binlog
            artifacts/*.log
            artifacts/site/build.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: build
    if: github.repository == 'wieslawsoltes/AvaloniaEdit' && github.ref == 'refs/heads/port/unoedit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the verified browser sample
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site serves this source revision
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['SITE_URL'].rstrip('/') + '/build.json?revision=' + os.environ['GITHUB_SHA']
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.load(response)
                  if data.get('revision') == os.environ['GITHUB_SHA']:
                      print(json.dumps(data, indent=2))
                      break
              except (OSError, ValueError) as error:
                  print(str(error))
              if attempt == 11:
                  raise SystemExit('Pages deployment completed, but its public revision could not be verified.')
              time.sleep(5)
          PY
