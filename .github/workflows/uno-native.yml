name: Uno native backend

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uno-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test shared engine and native input semantics
        run: dotnet test test/UnoEdit.Core.Tests/UnoEdit.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests/core
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uno-core-${{ matrix.os }}
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 14

  rendering:
    name: Native shaped rendering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test native text shaping and viewport
        run: dotnet test test/UnoEdit.Rendering.Skia.Tests/UnoEdit.Rendering.Skia.Tests.csproj -c Release --logger "trx;LogFileName=rendering.trx" --results-directory artifacts/tests/rendering
      - name: Pack reusable rendering library
        run: dotnet pack src/UnoEdit.Rendering.Skia/UnoEdit.Rendering.Skia.csproj -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uno-rendering-validation
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  applications:
    name: Uno desktop and WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install browser toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build native desktop sample
        run: dotnet build src/UnoEdit.Uno.Demo/UnoEdit.Uno.Demo.csproj -c Release -f net10.0-desktop -bl:desktop.binlog
      - name: Publish native WebAssembly sample
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: dotnet publish src/UnoEdit.Uno.Demo/UnoEdit.Uno.Demo.csproj -c Release -f net10.0-browserwasm -p:WasmShellWebAppBasePath=/$REPOSITORY_NAME/ -o artifacts/browser -bl:browser.binlog
      - name: Install pinned browser test runner
        run: |
          npm install --prefix tools --no-save --package-lock=false playwright@1.64.0
          tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify published application with real keyboard and pointer input
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node tools/browser-smoke.mjs artifacts/browser "$REPOSITORY_NAME"
      - name: Record source revision
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-revision.txt
      - name: Surface browser diagnostics
        if: failure()
        run: |
          test ! -f artifacts/browser-tests/results.json || cat artifacts/browser-tests/results.json
          test ! -f artifacts/browser-tests/failure-state.json || cat artifacts/browser-tests/failure-state.json
          test ! -f artifacts/browser-tests/console.log || tail -100 artifacts/browser-tests/console.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uno-application-validation
          path: |
            artifacts/browser
            artifacts/browser-tests
            artifacts/source-revision.txt
            desktop.binlog
            browser.binlog
          if-no-files-found: warn
          retention-days: 7
