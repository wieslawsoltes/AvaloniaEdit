name: UnoEdit CI

on:
  push:
    branches: [master, port/unoedit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Source baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source revision
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AvaloniaEdit.slnx
      - name: Build
        run: dotnet build AvaloniaEdit.slnx -c Release --no-restore
      - name: Test original regression suite
        run: dotnet test test/AvaloniaEdit.Tests/AvaloniaEdit.Tests.csproj -c Release --no-build --logger "trx;LogFileName=baseline.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
