name: Scribe independent editor
on:
  push:
    branches: [feat/standalone-text-control]
    paths: ['standalone/**', '.github/workflows/scribe-standalone.yml']
  pull_request:
    paths: ['standalone/**', '.github/workflows/scribe-standalone.yml']
permissions:
  contents: read
concurrency:
  group: scribe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: standalone
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Validate original document engine
        run: |
          mkdir -p artifacts/validation
          dotnet run --project tests/Scribe.Core.Tests -c Release 2>&1 | tee artifacts/validation/core.log
      - name: Compile desktop and independent controls
        if: success() || failure()
        run: dotnet build samples/Scribe.Desktop -c Release 2>&1 | tee artifacts/validation/desktop.log
      - name: Native headless control tests
        if: success() || failure()
        run: dotnet run --project tests/Scribe.UI.Tests -c Release 2>&1 | tee artifacts/validation/ui.log
      - name: Publish real Avalonia WebAssembly sample
        if: success() || failure()
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet publish samples/Scribe.Browser -c Release -o artifacts/browser 2>&1 | tee artifacts/validation/browser-build.log
      - name: Validate native browser input
        if: success() || failure()
        run: |
          python -m pip install playwright==1.64.0 pillow==12.0.0
          python -m playwright install --with-deps chromium
          python tools/browser_validate.py artifacts/browser 2>&1 | tee artifacts/validation/browser.log
      - name: Validate completion focus and asynchronous result guards
        if: success() || failure()
        run: python tools/browser_deep_validate.py artifacts/browser 2>&1 | tee artifacts/validation/browser-deep.log
      - name: Audit independent dependencies and package consumer
        if: success() || failure()
        run: |
          python tools/verify_independence.py
          dotnet pack src/Scribe.Core -c Release -o artifacts/packages
          dotnet pack src/Scribe.Avalonia -c Release -o artifacts/packages
          python tools/verify_packages.py
      - name: Stage clean standalone source and identity
        if: always()
        run: |
          mkdir -p artifacts/source artifacts/validation
          git -C .. archive HEAD standalone | tar -x -C artifacts/source --strip-components=1
          git -C .. rev-parse HEAD > artifacts/validation/commit.txt
          dotnet --info > artifacts/validation/dotnet-info.txt
          printf '%s\n' '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' > artifacts/validation/ci-run.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path('artifacts')
          files=[]
          for group in ('source','browser','packages'):
              for path in sorted((root/group).rglob('*')):
                  if path.is_file():
                      files.append({'path':str(path.relative_to(root)),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          (root/'validation/file-manifest.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'files':files},indent=2))
          PY
      - name: Verify source builds independently outside repository
        if: success()
        run: |
          destination=$(mktemp -d)
          cp -a artifacts/source/. "$destination/"
          (cd "$destination" && dotnet run --project tests/Scribe.Core.Tests -c Release && dotnet run --project tests/Scribe.UI.Tests -c Release) 2>&1 | tee artifacts/validation/standalone-source-consumer.log
          rm -rf "$destination"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-source
          path: standalone/artifacts/source
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-browser
          path: standalone/artifacts/browser
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-packages
          path: standalone/artifacts/packages
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-validation
          path: standalone/artifacts/validation
          retention-days: 14
