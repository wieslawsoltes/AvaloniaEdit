name: Scribe independent editor
on:
  push:
    branches: [feat/standalone-text-control]
    paths: ['standalone/**', '.github/workflows/scribe-standalone.yml']
permissions:
  contents: read
concurrency:
  group: scribe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: standalone
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Validate original document engine
        run: |
          mkdir -p artifacts/validation
          dotnet run --project tests/Scribe.Core.Tests -c Release 2>&1 | tee artifacts/validation/core.log
      - name: Compile independent Avalonia controls
        if: success() || failure()
        run: dotnet build src/Scribe.Avalonia -c Release 2>&1 | tee artifacts/validation/controls.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribe-validation
          path: standalone/artifacts/validation
