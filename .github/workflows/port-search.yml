name: Validate native search migration

on:
  push:
    branches: [port/unoedit]
    paths: ['.github/workflows/port-search.yml', 'tools/port-search.patch']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unoedit-search-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.repository == 'wieslawsoltes/AvaloniaEdit' && github.ref == 'refs/heads/port/unoedit'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Integrate native search against the exact source baseline
        shell: bash
        run: |
          mkdir -p artifacts
          # Normalize patch separators; all C# and JavaScript edits remain
          # visible in the checked-in patch and are checked before application.
          sed 's/^ diff --git /diff --git /' tools/port-search.patch > "$RUNNER_TEMP/native-search.patch"
          if git apply --check --recount "$RUNNER_TEMP/native-search.patch"; then
            git apply --recount "$RUNNER_TEMP/native-search.patch"
          elif git apply --reverse --check --recount "$RUNNER_TEMP/native-search.patch"; then
            echo 'Native search integration is already applied.'
          else
            echo 'Source changed; refusing to apply an ambiguous migration.' >&2
            exit 1
          fi
          git add src test
          git add -f tools/browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'port: integrate native templated search, safe replacement, marker geometry and browser checks'
          fi
          git rev-parse HEAD > artifacts/source-revision.txt
      - name: Execute all original, core and native renderer regressions
        run: |
          python3 tools/build.py test
          python3 -m unittest discover -s test -p test_build_tools.py -v
      - name: Install browser workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build native desktop sample
        run: |
          python3 tools/build.py desktop > artifacts/desktop.log 2>&1 || { tail -100 artifacts/desktop.log; exit 1; }
          tail -12 artifacts/desktop.log
      - name: Exercise native templates, search, protection and lifecycle on Linux
        env:
          UNOEDIT_NATIVE_CHECKS: '1'
        run: |
          xvfb-run -a timeout 90s dotnet run --project src/UnoEdit.Uno.Demo/UnoEdit.Uno.Demo.csproj -c Release -f net10.0-desktop --no-build > artifacts/native-runtime.log 2>&1 || { tail -100 artifacts/native-runtime.log; exit 1; }
          cat artifacts/native-runtime.log
      - name: Publish native browser sample
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 tools/build.py browser --base-path "/$REPOSITORY_NAME/" > artifacts/browser.log 2>&1 || { tail -100 artifacts/browser.log; exit 1; }
          tail -5 artifacts/browser.log
      - name: Verify the exact static site with real native search input
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          npm install --prefix tools --no-save --package-lock=false playwright@1.64.0
          tools/node_modules/.bin/playwright install --with-deps chromium > artifacts/playwright-install.log 2>&1
          node tools/browser-smoke.mjs artifacts/site "$REPOSITORY_NAME"
      - name: Validate packaged native controls and independent consumers
        run: |
          python3 tools/build.py pack > artifacts/packages.log 2>&1 || { tail -120 artifacts/packages.log; exit 1; }
          tail -20 artifacts/packages.log
      - name: Push only the validated source revision
        run: |
          # Never force-push. A concurrent branch update safely rejects this push.
          git push origin HEAD:refs/heads/port/unoedit
      - name: Preserve exact source and validation evidence
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
          git rev-parse HEAD > artifacts/source-revision.txt
          test ! -f artifacts/browser-tests/failure-state.json || cat artifacts/browser-tests/failure-state.json
          test ! -f artifacts/browser-tests/console.log || tail -100 artifacts/browser-tests/console.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unoedit-native-search-validation
          path: |
            artifacts/tests
            artifacts/browser-tests
            artifacts/packages
            artifacts/*.log
            artifacts/*.binlog
            artifacts/*.txt
            artifacts/source.tar.gz
          if-no-files-found: error
          retention-days: 14
